[project]
name = "ai-agentops"
version = "0.1.0"
description = "AI AgentOps: a mock-first, provider-agnostic, security-first agentic AI platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "langgraph>=1.0",
    "litellm>=1.83",
    "mcp>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/agentops_api",
    "packages/core/agentops_core",
    "packages/llm/agentops_llm",
    "packages/data/agentops_data",
    "packages/retrieval/agentops_retrieval",
    "packages/agents/agentops_agents",
    "packages/tools/agentops_tools",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["templates", "scripts", "tests", "skills"]

[tool.ruff.lint]
# S110/BLE001/E722 back arch-103 (swallowed and blind exceptions).
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "N", "ANN"]

[tool.ruff.format]
# Code blocks in the specs are illustrative; ruff 0.17 would reformat them.
exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentops_agents",
    "agentops_api",
    "agentops_core",
    "agentops_data",
    "agentops_llm",
    "agentops_retrieval",
    "agentops_tools",
    "testsuite",
]

[tool.ruff.lint.per-file-ignores]
"testsuite/**/*.py" = ["S101", "ANN401"]
# The LiteLLM adapter handles untyped SDK objects.
"packages/llm/agentops_llm/{litellm_provider,testing}.py" = ["ANN401"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/agentops_api",
    "packages/core/agentops_core",
    "packages/llm/agentops_llm",
    "packages/data/agentops_data",
    "packages/retrieval/agentops_retrieval",
    "packages/agents/agentops_agents",
    "packages/tools/agentops_tools",
    "testsuite",
]
mypy_path = [
    "apps/api",
    "packages/core",
    "packages/llm",
    "packages/data",
    "packages/retrieval",
    "packages/agents",
    "packages/tools",
]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["testsuite"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = [
    # LiteLLM's own TypedDicts; not our code.
    "ignore:Items? .* on TypedDict class .* (is|are) using the `ReadOnly` qualifier:UserWarning",
]
markers = [
    "integration: needs local PostgreSQL from docker compose",
    "live: calls a real model provider; never in default CI",
]

[tool.uv]
# Supply-chain cooldown (D-006): resolve only releases at least ~14 days old.
# Move this date forward deliberately when upgrading dependencies.
exclude-newer = "2026-11-05T00:00:00Z"
