name: ci

on:
  push:
  pull_request:

# No secrets are used: tests run in LLM_MODE=mock with the network guard on.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CW_SKIP_ADOPTION_MATRIX: "1"
      LLM_MODE: mock
      ENABLE_LIVE_LLM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Not `npm run setup`: the harness would pip-install into the system Python (D-004).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"

      - name: Install Python dependencies from the lockfile
        run: uv sync --locked

      - name: Verify project
        run: npm run check

      # Local throwaway Postgres from docker-compose.yml; the default passwords are fine here.
      - name: Integration tests (PostgreSQL + pgvector)
        run: |
          docker compose up -d --wait postgres
          uv run pytest testsuite -q -m "integration and not live"

      - name: Verify architecture
        run: npm run check-arch
