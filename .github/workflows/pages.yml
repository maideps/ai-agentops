name: pages

# Publishes the replay demo (apps/web static export) to GitHub Pages at
# https://maideps.github.io/ai-agentops/. It reads only fixtures/replays: no secrets,
# no backend, no model calls.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "fixtures/replays/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Node 24)

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6 (Node 24)
        with:
          node-version-file: .nvmrc

      - name: Build the static export under /ai-agentops
        env:
          NEXT_BASE_PATH: /ai-agentops
        run: |
          npm ci --prefix apps/web
          npm --prefix apps/web run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
